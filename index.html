<!doctype html>
<html lang="en">
<head>

  <script>

    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <nav class="topnav" aria-label="Tool categories">
